name: Pages

# Worker PAT pushes trigger this; Actions-token pushes call the reusable workflow.
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths:
      - "runs/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build recorded evidence and documentation from main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.13.0
          enable-cache: true
      - name: Install CPython and locked site dependencies
        run: |
          uv python install 3.15.0
          uv sync --locked --all-groups --python 3.15.0
      - name: Build Mission Control and documentation
        run: |
          uv run --locked python scripts/build_public_site.py --output "$RUNNER_TEMP/public"
          uv run --locked mkdocs build --strict --site-dir "$RUNNER_TEMP/public/docs"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/public

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
