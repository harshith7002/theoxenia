site_name: Theoxenia
site_description: Evidence-first, reproducible research on public radio technosignature data
repo_url: https://github.com/mpetyx/theoxenia

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
  features:
    - navigation.sections
    - content.code.copy

nav:
  - Home: index.md
  - Architecture: architecture.md
  - EXP-001 data sources: data-sources.md
  - Data-source endpoint check: sources-check.md
  - EXP-002 method: mission-control-exp002.md
  - EXP-004 synthetic cadence: mission-control-exp004.md
  - EXP-003 archive cadence: mission-control-exp003.md
  - Known transmitters: known-sources.md
  - Mission Control queue: mission-control-m3.md
  - Mission Control deploy: mission-control-deploy.md
  - Mission Control copy: mission-control-m4.md
  - Mission Control detail pages: mission-control-detail.md
  - Experiments: experiments.md
  - EXP-020 Nimitz baseline: exp-020.md
  - EXP-010 Blue Book OCR: exp-010.md
  - Hardening: hardening.md
  - Dependency compatibility: DEPENDENCIES.md
  - Mission Control M0: mission-control-m0.md
  - Scaffold integration review: scaffold-integration.md
  - Agents and contributors: agents.md

markdown_extensions:
  - tables
  - admonition
  - pymdownx.superfences
