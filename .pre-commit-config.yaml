repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: staged-file-policy
        name: Reject raw scientific data and files over 2 MiB
        entry: uv run --locked python scripts/check_staged_files.py
        language: system
        pass_filenames: true
        always_run: false

      - id: banned-words
        name: Reject banned words in site templates
        entry: uv run --locked python scripts/check_banned_words.py
        language: system
        pass_filenames: false
        always_run: true
